<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scene · Roadmap (Terrain)</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  /* The canvas stays pinned while the document scrolls — scroll position drives the terrain morph. */
  body { height: 100%; }
  #scroll-host { height: 300vh; }   /* total scroll length = 3 viewports → covers stages 0 → 1 → 2 */
  #scene { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; }

  /* Optional scroll hint */
  #scroll-hint {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,.6); font: 11px/1 -apple-system, system-ui, sans-serif;
    letter-spacing: 1px; text-transform: uppercase; pointer-events: none;
    z-index: 10;
  }

  /* UI PANEL — remove this block to drop the controls */
  #ui-panel { position: fixed; top: 12px; right: 12px; background: rgba(10,10,12,.75); color: #fff;
    font: 11px/1.4 -apple-system, system-ui, sans-serif; padding: 8px 10px; border: 1px solid rgba(255,255,255,.12);
    border-radius: 6px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    max-width: 240px; max-height: 80vh; overflow: auto; z-index: 1000; user-select: none; }
  #ui-toggle { background: none; border: none; color: #fff; cursor: pointer; font-size: 14px; padding: 0; }
  #ui-body { display: none; margin-top: 6px; }
  #ui-panel.-open #ui-body { display: block; }
  #ui-body label { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 0; }
  #ui-body input[type=color] { width: 28px; height: 20px; border: 1px solid rgba(255,255,255,.2); border-radius: 3px; padding: 0; background: none; cursor: pointer; }
  #ui-body input[type=range] { width: 110px; }
  #ui-snapshot { margin: 8px 0 0; padding: 6px 8px; background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.12); border-radius: 4px;
    font: 10px/1.45 ui-monospace, 'SF Mono', Menlo, monospace;
    white-space: pre-wrap; word-break: break-word; color: rgba(255,255,255,.88);
    max-height: 240px; overflow: auto; user-select: text; cursor: text; }
  /* END UI PANEL */
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.143.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.143.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>


<script type="module">
import * as THREE from 'three'
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js'
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js'
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js'
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js'
import { GammaCorrectionShader } from 'three/addons/shaders/GammaCorrectionShader.js'
import { CopyShader } from 'three/addons/shaders/CopyShader.js'

/* ============================================================
   CONFIG
============================================================ */
const CONFIG = {
  // Terrain
  warmHue:        '#b0e4cd',   // warm peak color (gold)
  coolHue:        '#275a47',   // deep indigo base
  brightness:     1.35,        // multiplier for terrain color
  bloomAmount:    0.45,        // fake-bloom halo strength around each point
  bloomWidth:     1.0,         // 0..1 width of that halo across the sprite
  appearFade:     1.0,         // master alpha
  flowSpeed:      0.08,        // continuous forward scroll (stages/sec); scroll adds on top
  // Corner shader
  cornerBlue:     '#0a1413',
  cornerOrange:   '#408a71'
}

/* ---------- LAYERS / EASING / FINAL PASS ---------- */
/* ---------- DEFAULTS + localStorage (load before building) ---------- */
const DEFAULTS = JSON.parse(JSON.stringify(CONFIG))
const STORAGE_KEY = 'getlayers:terrain'
function saveConfig() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(CONFIG)) } catch (e) {} }

const LAYERS = { NONE: 0, TORUS_SCENE: 1, BLOOM_SCENE: 2, ENTIRE_SCENE: 3 }
const Lerp = (a, b, t) => a + (b - a) * t
const clamp = (v, mn, mx) => Math.max(mn, Math.min(mx, v))

function hexToVec3(hex) {
  const n = parseInt(hex.slice(1), 16)
  return new THREE.Vector3(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255)
}

const FinalPass = {
  uniforms: {
    iTime: { value: 0 }, tDiffuse: { value: null },
    torusTexture: { value: null }, bloomTexture: { value: null }, haloTexture: { value: null },
    iCornerBlue:   { value: hexToVec3(CONFIG.cornerBlue) },
    iCornerOrange: { value: hexToVec3(CONFIG.cornerOrange) }
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position, 1.0); }`,
  fragmentShader: `
    uniform float iTime; uniform sampler2D tDiffuse; uniform sampler2D bloomTexture; uniform sampler2D torusTexture; uniform sampler2D haloTexture;
    uniform vec3 iCornerBlue; uniform vec3 iCornerOrange;
    varying vec2 vUv;
    vec3 warp3d(vec3 pos, float t) {
      float curv = .8, a = 1.9, b = 0.7; pos *= 2.;
      pos.x += curv * sin(t + a * pos.y) + t * b; pos.y += curv * cos(t + a * pos.x);
      pos.y += curv * sin(t + a * pos.z) + t * b; pos.z += curv * cos(t + a * pos.y);
      pos.z += curv * sin(t + a * pos.x) + t * b; pos.x += curv * cos(t + a * pos.z);
      return 0.5 + 0.5 * cos(pos.xyz + vec3(1, 2, 4));
    }
    void main() {
      vec2 uv = 2. * vUv - 1.;
      vec3 w = pow(warp3d(vec3(uv.x, sin(uv.y), uv.y), iTime * 1.5), vec3(1.5));
      vec3 col = 1.5 * iCornerBlue * w.x; col *= w.y; col += iCornerOrange * w.z;
      col *= smoothstep(0.6, 1., abs(uv.y));
      col *= smoothstep(-.5, 1., -uv.y * uv.x); col *= smoothstep(-.5, 1., -uv.y * uv.x);
      vec3 halo = texture2D(haloTexture, vUv).xyz;
      vec3 atmoBg = vec3(0.05, 0.04, 0.12) * (1.0 - 0.4 * length(uv));
      gl_FragColor = vec4(atmoBg + col * 0.2 + texture2D(bloomTexture, vUv).xyz + texture2D(torusTexture, vUv).xyz + texture2D(tDiffuse, vUv).xyz + halo, 1.);
    }`
}

/* ---------- RENDERER / SCENE / CAMERA ---------- */
const canvas = document.getElementById('scene')
const renderer = new THREE.WebGL1Renderer({ canvas, antialias: true })
renderer.setPixelRatio(window.devicePixelRatio)
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap

const scene = new THREE.Scene()
scene.background = new THREE.Color(0x000000); scene.fog = new THREE.Fog(0x000000, 0, 15)

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 80)
camera.position.set(0, 0, 3)
camera.layers.enable(LAYERS.TORUS_SCENE); camera.layers.enable(LAYERS.BLOOM_SCENE); camera.layers.enable(LAYERS.ENTIRE_SCENE)
scene.add(camera)

/* ---------- COMPOSER ---------- */
const renderScene = new RenderPass(scene, camera)
const torusComposer = new EffectComposer(renderer); torusComposer.renderToScreen = false
torusComposer.addPass(renderScene)
torusComposer.addPass(new ShaderPass(GammaCorrectionShader))
torusComposer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.6, 0.3, 0))
torusComposer.addPass(new ShaderPass(CopyShader))
const bloomComposer = new EffectComposer(renderer); bloomComposer.renderToScreen = false
bloomComposer.addPass(renderScene)
bloomComposer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.0, 1.15, 0))
bloomComposer.addPass(new ShaderPass(GammaCorrectionShader))
const finalPass = new ShaderPass(FinalPass)
finalPass.uniforms.bloomTexture.value = bloomComposer.renderTarget1.texture
finalPass.uniforms.torusTexture.value = torusComposer.renderTarget1.texture
const finalComposer = new EffectComposer(renderer)
finalComposer.addPass(renderScene); finalComposer.addPass(finalPass)

/* ============================================================
   SCENE: Terrain (Object6) — scroll-driven
============================================================ */
class Terrain {
  instance = new THREE.Group()
  I = 100; J = 100
  position = [0, -0.3, 0]

  constructor(scene) {
    this.shader = {
      uniforms: {
        iAnimation: { value: 0 },
        uFlow:      { value: 0 },
        iTime:      { value: 0 },
        iResolution: { value: { x: window.innerWidth * window.devicePixelRatio, y: window.innerHeight * window.devicePixelRatio } },
        uAlpha:       { value: 0 },
        uWarm:        { value: hexToVec3(CONFIG.warmHue) },
        uCool:        { value: hexToVec3(CONFIG.coolHue) },
        uBrightness:  { value: CONFIG.brightness },
        uBloomAmount: { value: CONFIG.bloomAmount },
        uBloomWidth:  { value: CONFIG.bloomWidth }
      },
      vertexShader: `
        uniform float iAnimation; uniform float uFlow; uniform float iTime; uniform vec2 iResolution;
        uniform vec3 uWarm; uniform vec3 uCool; uniform float uBrightness;
        varying float cameraDistance; varying float z; varying vec3 c;
        vec4 permute(vec4 x){ return mod(((x * 34.0) + 1.0) * x, 289.0); }
        vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }
        vec3 fade(vec3 t) { return t * t * t * (t * (t * 6.0 - 15.0) + 10.0); }
        float cnoise(vec3 P) {
          vec3 Pi0 = floor(P); vec3 Pi1 = Pi0 + vec3(1.0);
          Pi0 = mod(Pi0, 289.0); Pi1 = mod(Pi1, 289.0);
          vec3 Pf0 = fract(P); vec3 Pf1 = Pf0 - vec3(1.0);
          vec4 ix = vec4(Pi0.x, Pi1.x, Pi0.x, Pi1.x);
          vec4 iy = vec4(Pi0.yy, Pi1.yy);
          vec4 iz0 = Pi0.zzzz; vec4 iz1 = Pi1.zzzz;
          vec4 ixy = permute(permute(ix) + iy);
          vec4 ixy0 = permute(ixy + iz0); vec4 ixy1 = permute(ixy + iz1);
          vec4 gx0 = ixy0 / 7.0; vec4 gy0 = fract(floor(gx0) / 7.0) - 0.5;
          gx0 = fract(gx0);
          vec4 gz0 = vec4(0.5) - abs(gx0) - abs(gy0);
          vec4 sz0 = step(gz0, vec4(0.0));
          gx0 -= sz0 * (step(0.0, gx0) - 0.5);
          gy0 -= sz0 * (step(0.0, gy0) - 0.5);
          vec4 gx1 = ixy1 / 7.0; vec4 gy1 = fract(floor(gx1) / 7.0) - 0.5;
          gx1 = fract(gx1);
          vec4 gz1 = vec4(0.5) - abs(gx1) - abs(gy1);
          vec4 sz1 = step(gz1, vec4(0.0));
          gx1 -= sz1 * (step(0.0, gx1) - 0.5);
          gy1 -= sz1 * (step(0.0, gy1) - 0.5);
          vec3 g000 = vec3(gx0.x, gy0.x, gz0.x); vec3 g100 = vec3(gx0.y, gy0.y, gz0.y);
          vec3 g010 = vec3(gx0.z, gy0.z, gz0.z); vec3 g110 = vec3(gx0.w, gy0.w, gz0.w);
          vec3 g001 = vec3(gx1.x, gy1.x, gz1.x); vec3 g101 = vec3(gx1.y, gy1.y, gz1.y);
          vec3 g011 = vec3(gx1.z, gy1.z, gz1.z); vec3 g111 = vec3(gx1.w, gy1.w, gz1.w);
          vec4 norm0 = taylorInvSqrt(vec4(dot(g000,g000), dot(g010,g010), dot(g100,g100), dot(g110,g110)));
          g000 *= norm0.x; g010 *= norm0.y; g100 *= norm0.z; g110 *= norm0.w;
          vec4 norm1 = taylorInvSqrt(vec4(dot(g001,g001), dot(g011,g011), dot(g101,g101), dot(g111,g111)));
          g001 *= norm1.x; g011 *= norm1.y; g101 *= norm1.z; g111 *= norm1.w;
          float n000 = dot(g000, Pf0);
          float n100 = dot(g100, vec3(Pf1.x, Pf0.yz));
          float n010 = dot(g010, vec3(Pf0.x, Pf1.y, Pf0.z));
          float n110 = dot(g110, vec3(Pf1.xy, Pf0.z));
          float n001 = dot(g001, vec3(Pf0.xy, Pf1.z));
          float n101 = dot(g101, vec3(Pf1.x, Pf0.y, Pf1.z));
          float n011 = dot(g011, vec3(Pf0.x, Pf1.yz));
          float n111 = dot(g111, Pf1);
          vec3 fade_xyz = fade(Pf0);
          vec4 n_z = mix(vec4(n000, n100, n010, n110), vec4(n001, n101, n011, n111), fade_xyz.z);
          vec2 n_yz = mix(n_z.xy, n_z.zw, fade_xyz.y);
          return 2.2 * mix(n_yz.x, n_yz.y, fade_xyz.x);
        }
        const mat2 m2 = mat2(0.8, -0.6, 0.6, 0.8);
        float fbm(in vec3 p) {
          float f = 0.0;
          f += 0.55000 * cnoise(p);
          p.xz = m2 * p.xz * 2.02;
          f += 0.050 * cnoise(p);
          p.xz = m2 * p.xz * 2.05;
          f += 0.350 * cnoise(p);
          return f;
        }
        vec2 wnoise(vec2 pos, float t, float curv) {
          pos.x += curv * sin(2.0 * t + 1.5 * pos.y) + t * 0.5;
          pos.y += curv * cos(2.0 * t + 1.5 * pos.x);
          return 0.5 + 0.5 * cos(pos.xy + vec2(0, 2));
        }
        void main() {
          vec3 v = position;
          // Forward (Z) only: the full scroll range plus the continuous time flow
          // drive the forward advance. fract() wraps it into a seamless loop, and
          // the noise sample is shifted by the same amount to stay coherent.
          // (The old second stage scrolled X / reshaped sideways — removed so the
          // motion is forward-only.)
          float fwd = iAnimation + uFlow;
          v.z = fract(v.z + fwd);
          v.x = fract(v.x);
          v.x = 4. * (v.x * 1.6 - 0.8);
          v.z = 4. * (v.z * 1.3 - 0.65);
          v.y = .65 * clamp(abs(v.x / 2. + 2.), 0., 1.)
                    * fbm(.5 * (v - vec3(.6 * iTime, 0., 5.2 * fwd))) - .2 * v.x;
          v.x -= .3 * v.z - .3;
          vec2 h = wnoise(8. * (position.xy - vec2(iTime / 10.6, 0.)), 0., .4);
          float hue = (h.x + h.y) / 2.;
          float fade = cnoise(5. * (vec3(position.xz, 0.) - vec3(iTime / 10.6, 0., 0.))) * 1.3 + 0.7;
          float warm = step(.7, hue);
          c = mix(uCool, uWarm, warm) * fade * uBrightness;
          vec4 mvpos = modelViewMatrix * vec4(v, 1.);
          z = v.z;
          cameraDistance = length(cameraPosition - v);
          gl_PointSize = 22. * iResolution.y / 730. / -mvpos.z;
          gl_Position = projectionMatrix * mvpos;
        }`,
      fragmentShader: `
        varying float cameraDistance; varying float z; varying vec3 c;
        uniform float uAlpha;
        uniform float uBloomAmount;
        uniform float uBloomWidth;
        void main() {
          float pd = length(2. * gl_PointCoord - 1.);
          float d0 = .3;
          // Original gauss core (sharp glowing dot).
          float d = max(0., pd - d0) * max(.3, 1.5 * cameraDistance) * 8.;
          float core = pow(2.71828, -d * d / 2.) / 2.506628;
          // Fake-bloom halo: wider, softer falloff across the whole sprite.
          float halo = pow(max(0., 1. - pd / max(0.001, uBloomWidth)), 2.5) * uBloomAmount;
          float tex = core + halo;
          float depthFade = min(1., (-z + 2.7) / 1.3) * (z + 2.7) / 1.3;
          gl_FragColor = vec4(tex * c * 1.8, tex * depthFade) * uAlpha;
        }`
    }

    this.geometry = new THREE.BufferGeometry()
    const positions = new Float32Array(this.I * this.J * 3)
    let p = 0
    for (let i = 0; i < this.I; i++) {
      for (let j = 0; j < this.J; j++) {
        positions[p++] = i / this.I * 1.8 - 0.9
        positions[p++] = Math.random()
        positions[p++] = j / this.J * 1.7 - 0.85
      }
    }
    this.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3))

    this.material = new THREE.ShaderMaterial({
      vertexShader: this.shader.vertexShader,
      fragmentShader: this.shader.fragmentShader,
      uniforms: this.shader.uniforms,
      depthTest: false,
      transparent: true
    })
    this.material.stencil = false

    this.points = new THREE.Points(this.geometry, this.material)
    // Render on ENTIRE_SCENE (skipping the heavy bloom pass) — the fragment
    // shader already produces soft gaussian points, so bloom on top was the
    // root cause of the flickering.
    this.points.layers.enable(LAYERS.ENTIRE_SCENE)

    this.instance.add(this.points)
    this.instance.position.set(...this.position)
    scene.add(this.instance)

    // Smooth fade-in on load
    this.fadeStart = performance.now()
  }

  setAnimation(v) { this.shader.uniforms.iAnimation.value = v }

  render() {
    this.shader.uniforms.iTime.value = performance.now() / 1000
    // Smooth fade-in over 1.2s
    const fadeT = clamp((performance.now() - this.fadeStart) / 1200, 0, 1)
    this.shader.uniforms.uAlpha.value = fadeT * CONFIG.appearFade
  }
}

const terrain = new Terrain(scene)

/* ---------- SCROLL → iAnimation ---------- */
// 0 at top, 2 at bottom.
let targetAnim = 0
let smoothAnim = 0
let currentAnim = 0
// Continuous forward flow — accumulated as a phase so flowSpeed changes stay smooth.
let flowPhase = 0
let flowT0 = performance.now() / 1000
function updateScroll() {
  const max = document.documentElement.scrollHeight - window.innerHeight
  const t = max > 0 ? clamp(window.scrollY / max, 0, 1) : 0
  targetAnim = t * 2
}
const EMBEDDED = window.parent !== window
if (!EMBEDDED) { window.addEventListener('scroll', updateScroll, { passive: true }); updateScroll() }
window.addEventListener('message', e => { const m = e.data; if (m && m.gl === 1 && m.type === 'progress') targetAnim = clamp(m.v, 0, 1) * 2 })

/* ---------- CONFIG → uniforms ---------- */
function applyConfig() {
  terrain.shader.uniforms.uWarm.value.copy(hexToVec3(CONFIG.warmHue))
  terrain.shader.uniforms.uCool.value.copy(hexToVec3(CONFIG.coolHue))
  terrain.shader.uniforms.uBrightness.value  = CONFIG.brightness
  terrain.shader.uniforms.uBloomAmount.value = CONFIG.bloomAmount
  terrain.shader.uniforms.uBloomWidth.value  = CONFIG.bloomWidth
  finalPass.uniforms.iCornerBlue.value.copy(hexToVec3(CONFIG.cornerBlue))
  finalPass.uniforms.iCornerOrange.value.copy(hexToVec3(CONFIG.cornerOrange))
}

/* ---------- RESIZE ---------- */
function resize() {
  const w = window.innerWidth, h = window.innerHeight, dpr = Math.min(window.devicePixelRatio, 1.5)
  renderer.setPixelRatio(dpr); renderer.setSize(w, h, false)
  camera.aspect = w / h; camera.updateProjectionMatrix()
  for (const c of [torusComposer, bloomComposer, finalComposer]) {
    c.setPixelRatio(dpr); c.setSize(w, h)
  }
  terrain.shader.uniforms.iResolution.value.x = w * dpr
  terrain.shader.uniforms.iResolution.value.y = h * dpr
  if (!EMBEDDED) updateScroll()
}
window.addEventListener('resize', resize); resize()

/* ---------- RENDER LOOP ---------- */
function render() {
  requestAnimationFrame(render)
  // Smooth out scroll-driven animation
  // Double-damped smoothing — extra-smooth, and gentle when the scroll direction flips.
  smoothAnim = Lerp(smoothAnim, targetAnim, 0.10)
  currentAnim = Lerp(currentAnim, smoothAnim, 0.06)
  terrain.setAnimation(currentAnim)
  // Advance the continuous forward flow (dt clamped so a slow frame can't jump it).
  const flowNow = performance.now() / 1000
  flowPhase += CONFIG.flowSpeed * Math.min(0.05, flowNow - flowT0)
  flowT0 = flowNow
  terrain.shader.uniforms.uFlow.value = flowPhase
  terrain.render()
  const t = performance.now() / 1000
  finalPass.uniforms.iTime.value = t
  camera.layers.set(LAYERS.TORUS_SCENE);  torusComposer.render()
  camera.layers.set(LAYERS.BLOOM_SCENE);  bloomComposer.render()
  camera.layers.set(LAYERS.ENTIRE_SCENE); finalComposer.render()
}
render()

/* ===== UI (remove this block to drop the panel) ===== */
function setupColorUI(config, apply) {
  const panel = document.getElementById('ui-panel')
  const toggle = document.getElementById('ui-toggle')
  const body = document.getElementById('ui-body')
  if (!panel) return
  toggle.addEventListener('click', () => panel.classList.toggle('-open'))
  // Wrap apply so every change also refreshes the snapshot box.
  const _apply = apply
  apply = () => { _apply(); saveConfig(); renderSnapshot(config) }
  const numericRanges = {
    brightness:  { min: 0, max: 3, step: 0.01 },
    bloomAmount: { min: 0, max: 2, step: 0.01 },
    bloomWidth:  { min: 0.1, max: 2, step: 0.01 },
    appearFade:  { min: 0, max: 2, step: 0.01 },
    flowSpeed:   { min: 0, max: 0.5, step: 0.005 }
  }
  for (const key of Object.keys(config)) {
    const v = config[key]
    const row = document.createElement('label')
    row.appendChild(Object.assign(document.createElement('span'), { textContent: key }))
    if (typeof v === 'string' && v[0] === '#') {
      const inp = document.createElement('input')
      inp.type = 'color'; inp.value = v
      inp.addEventListener('input', e => { config[key] = e.target.value; apply() })
      row.appendChild(inp)
    } else if (typeof v === 'number') {
      const r = numericRanges[key] || { min: 0, max: Math.max(1, v * 2), step: 0.01 }
      const inp = document.createElement('input')
      inp.type = 'range'; inp.min = String(r.min); inp.max = String(r.max); inp.step = String(r.step); inp.value = String(v)
      inp.addEventListener('input', e => { config[key] = parseFloat(e.target.value); apply() })
      row.appendChild(inp)
    }
    body.appendChild(row)
  }
  // Reload / Reset buttons
  const btns = document.createElement('div'); btns.style.cssText = 'display:flex;gap:6px;margin-top:8px'
  const mkBtn = (txt) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = txt; b.style.cssText = 'flex:1;cursor:pointer;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:4px;padding:5px 6px;font:11px/1 sans-serif'; return b }
  const reloadBtn = mkBtn('⟳ reload'); const resetBtn = mkBtn('↺ reset')
  reloadBtn.addEventListener('click', () => location.reload())
  resetBtn.addEventListener('click', () => { try { localStorage.removeItem(STORAGE_KEY) } catch (e) {} ; location.reload() })
  btns.appendChild(reloadBtn); btns.appendChild(resetBtn); body.appendChild(btns)
  panel.classList.add('-open')
  renderSnapshot(config)
}
function renderSnapshot(config) {
  const snap = document.getElementById('ui-snapshot')
  if (!snap) return
  const lines = ['const CONFIG = {']
  for (const key of Object.keys(config)) {
    const v = config[key]
    let formatted
    if (typeof v === 'string') formatted = "'" + v + "'"
    else if (Number.isInteger(v)) formatted = String(v)
    else formatted = String(parseFloat(v.toFixed(4)))
    lines.push('  ' + key + ': ' + formatted + ',')
  }
  lines.push('}')
  snap.textContent = lines.join('\n')
}
applyConfig()
setupColorUI(CONFIG, applyConfig)
